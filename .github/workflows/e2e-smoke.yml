name: E2E Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate stack secrets
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "GOLEK_API_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GOLEK_ADMIN_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Build and start stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "API ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not respond within 120s"
          docker compose logs api | tail -80
          exit 1

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              echo "Frontend ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Frontend did not respond within 60s"
          docker compose logs frontend | tail -50
          exit 1

      - name: Smoke check - API endpoints
        run: |
          echo "=== Health ==="
          curl -fsS http://localhost:3000/api/health
          echo ""
          echo "=== Playbooks without token must be 401 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/playbooks)" = 401
          echo "=== Playbooks list ==="
          curl -fsS -H "Authorization: Bearer $GOLEK_API_TOKEN" http://localhost:3000/api/playbooks | head -c 300
          echo ""
          echo "=== Sign in with the bootstrap admin ==="
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$GOLEK_ADMIN_PASSWORD\"}" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["token"])')
          test "$(curl -fsS -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/auth/me)" = '{"username":"admin","role":"admin"}'
          echo "=== Wrong password must be 401 ==="
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:3000/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"definitely-wrong-password"}')" = 401

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs api | tail -100
          docker compose logs frontend | tail -50

      - name: Teardown
        if: always()
        run: docker compose down -v
